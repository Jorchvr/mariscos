<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Los Primos · Iniciar sesión</title>
  <link rel="stylesheet" href="assets/styles.css?v=6" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="wave-bg" aria-hidden="true"></div>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-badge">
        <img src="assets/logo.png" alt="Mariscos Frescos Los Primos" class="brand-logo" />
        <p class="brand-location">Playa Miramar · Tampico, Tamaulipas</p>
      </div>

      <form id="loginForm" class="login-form" autocomplete="off" novalidate>
        <h2 class="form-title">Iniciar sesión</h2>
        <p class="form-hint">Accede al Punto de Venta</p>

        <label class="field">
          <span class="field-label">Usuario</span>
          <div class="field-input">
            <span class="field-icon">👤</span>
            <input id="username" type="text" placeholder="admin" autocomplete="off" required />
          </div>
        </label>

        <label class="field">
          <span class="field-label">Contraseña</span>
          <div class="field-input">
            <span class="field-icon">🔒</span>
            <input id="password" type="password" placeholder="••••" autocomplete="off" required />
            <button type="button" class="toggle-eye" id="togglePw" aria-label="Mostrar contraseña">👁</button>
          </div>
        </label>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox" id="remember" checked />
            <span>Recordarme</span>
          </label>
          <a href="#" class="link-muted" onclick="event.preventDefault();alert('Demo: contacta al administrador.')">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary btn-block">
          <span>Entrar al POS</span>
          <span aria-hidden="true">→</span>
        </button>

        <div id="loginError" class="alert-error hidden">Usuario o contraseña incorrectos.</div>

        <div class="demo-creds">
          <strong>Credenciales de demo</strong>
          <div><code>admin</code> / <code>1234</code></div>
          <div><code>cajero</code> / <code>1234</code></div>
        </div>
      </form>
    </section>
    <footer class="login-foot">
      Demo estático · Sin base de datos · <span>© Los Primos</span>
    </footer>
  </main>
  <script src="assets/login.js?v=6"></script>
</body>
</html>
